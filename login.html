<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 7 Edu - Sign Up</title>
</head>
<body>
    <img src="./GROUP 7 BANNER .jpeg" alt="Group 7 Edu Banner"><br><br>

    <h1>Sign Up for Group 7 Edu</h1>

    <form>
        <label for="fullName">Full Name</label><br>
        <input type="text" id="fullName" placeholder="Full Name" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="Email" required><br><br>

        <label for="dob">Date of Birth</label><br>
        <input type="date" id="dob" required><br><br>

        <label for="age">Age</label><br>
        <input type="number" id="age" placeholder="Age" required min="18" max="60"><br><br>

        <label>Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <input type="checkbox" id="terms" name="terms" value="agree" required>
        <label for="terms">I Agree to the <a href="#">Terms and Conditions</a></label><br><br>

        <input type="button" value="SIGN UP" onclick="window.location.href='tables.html'">
    </form>
</body>
</html>
